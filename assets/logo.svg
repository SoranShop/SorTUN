<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">SorTUN</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12365e"/>
      <stop offset="1" stop-color="#081a2e"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1fb5a8"/>
      <stop offset="0.6" stop-color="#34d0c3"/>
      <stop offset="1" stop-color="#7ef0e4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ef0e4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7ef0e4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="badge">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <!-- the link between the two servers: an S, for SorTUN -->
    <path d="M76 184 C 76 108, 180 148, 180 72" fill="none" stroke="#06121f" stroke-width="34" stroke-linecap="round"/>
    <path d="M76 184 C 76 108, 180 148, 180 72" fill="none" stroke="url(#link)" stroke-width="18" stroke-linecap="round"/>
    <path d="M76 184 C 76 108, 180 148, 180 72" fill="none" stroke="#081a2e" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 16" opacity="0.55"/>
    <!-- the two servers -->
    <circle cx="180" cy="72" r="46" fill="url(#glow)"/>
    <circle cx="76" cy="184" r="27" fill="#0d2238" stroke="#e9c46a" stroke-width="9"/>
    <circle cx="180" cy="72" r="27" fill="#0d2238" stroke="#e9c46a" stroke-width="9"/>
    <circle cx="76" cy="184" r="8" fill="#34d0c3"/>
    <circle cx="180" cy="72" r="8" fill="#7ef0e4"/>
  </g>
</svg>
