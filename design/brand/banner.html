<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SorTUN banner</title>
<!--
  The source of assets/banner.png (README header, 1280x420) and assets/social-preview.png
  (the repository's social card, 1280x640). Render with a browser at the size in the
  stylesheet: `?card` switches to the tall social card. The fonts are the panel's own (SIL OFL).
-->
<style>
  @font-face { font-family: "Space Grotesk"; src: url("../fonts/SpaceGrotesk-wght.woff2"); font-weight: 300 700; }
  @font-face { font-family: "Estedad"; src: url("../fonts/Estedad-wght.woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; background: #081a2e; }
  .art { position: relative; width: 1280px; height: 420px; overflow: hidden; border-radius: 28px;
         background: linear-gradient(135deg, #12365e, #081a2e); font-family: "Space Grotesk", "Estedad", sans-serif; }
  body.card .art { height: 640px; }
  .net { position: absolute; right: 0; top: 0; width: 560px; height: 100%; opacity: .95; }
  .brand { position: absolute; left: 76px; top: 44px; display: flex; align-items: center; gap: 28px; }
  .brand svg { width: 112px; height: 112px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
  .name { display: flex; align-items: baseline; gap: 22px; }
  .name b { font-size: 92px; font-weight: 700; color: #fff; letter-spacing: .5px; line-height: 1; }
  .name span { font-family: "Estedad", sans-serif; font-size: 58px; font-weight: 600; color: #e9c46a; line-height: 1; }
  .say { position: absolute; left: 76px; top: 184px; }
  .say .en { font-size: 31px; color: #cfe3f5; font-weight: 500; }
  .say .fa { font-family: "Estedad", sans-serif; direction: rtl; text-align: left; font-size: 30px; color: #e9c46a; margin-top: 10px; font-weight: 500; }
  .say .sub { font-size: 20px; color: #7fa3c4; margin-top: 18px; letter-spacing: .2px; }
  body.card .brand { top: 150px; }
  body.card .say { top: 290px; }
</style>
</head>
<body>
<div class="art">
  <!-- a small network of servers on the right: nodes and the links between them -->
  <svg class="net" viewBox="0 0 560 640" preserveAspectRatio="xMaxYMin slice" aria-hidden="true">
    <defs>
      <linearGradient id="ln" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1fb5a8"/><stop offset="1" stop-color="#7ef0e4"/></linearGradient>
      <radialGradient id="ng" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7ef0e4" stop-opacity=".35"/><stop offset="1" stop-color="#7ef0e4" stop-opacity="0"/></radialGradient>
    </defs>
    <g stroke="#5f7d9c" stroke-width="1.5" opacity=".45" fill="none">
      <path d="M120 300 L250 190 L400 250 L500 120"/><path d="M250 190 L330 70"/><path d="M400 250 L470 380 L330 470"/>
      <path d="M120 300 L210 430 L330 470"/><path d="M500 120 L540 260 L470 380"/>
    </g>
    <path d="M120 300 C 160 240, 210 220, 250 190 S 360 240, 400 250" fill="none" stroke="url(#ln)" stroke-width="5" stroke-linecap="round"/>
    <path d="M400 250 C 430 300, 450 340, 470 380" fill="none" stroke="url(#ln)" stroke-width="5" stroke-linecap="round"/>
    <g fill="#7ef0e4"><circle cx="186" cy="238" r="3.5"/><circle cx="330" cy="222" r="3.5"/><circle cx="446" cy="330" r="3.5"/></g>
    <g>
      <circle cx="250" cy="190" r="30" fill="url(#ng)"/>
      <circle cx="120" cy="300" r="13" fill="#0d2238" stroke="#e9c46a" stroke-width="5"/>
      <circle cx="250" cy="190" r="15" fill="#0d2238" stroke="#34d0c3" stroke-width="5"/>
      <circle cx="400" cy="250" r="13" fill="#0d2238" stroke="#34d0c3" stroke-width="5"/>
      <circle cx="470" cy="380" r="13" fill="#0d2238" stroke="#e9c46a" stroke-width="5"/>
      <circle cx="500" cy="120" r="9" fill="#0d2238" stroke="#5f7d9c" stroke-width="4"/>
      <circle cx="330" cy="70" r="8" fill="#0d2238" stroke="#5f7d9c" stroke-width="4"/>
      <circle cx="330" cy="470" r="9" fill="#0d2238" stroke="#5f7d9c" stroke-width="4"/>
      <circle cx="210" cy="430" r="8" fill="#0d2238" stroke="#5f7d9c" stroke-width="4"/>
      <circle cx="540" cy="260" r="8" fill="#0d2238" stroke="#5f7d9c" stroke-width="4"/>
    </g>
  </svg>

  <div class="brand">
    <svg viewBox="0 0 256 256" aria-hidden="true">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12365e"/><stop offset="1" stop-color="#081a2e"/></linearGradient>
        <linearGradient id="link" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1fb5a8"/><stop offset=".6" stop-color="#34d0c3"/><stop offset="1" stop-color="#7ef0e4"/></linearGradient>
        <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7ef0e4" stop-opacity=".45"/><stop offset="1" stop-color="#7ef0e4" stop-opacity="0"/></radialGradient>
        <clipPath id="badge"><rect width="256" height="256" rx="56"/></clipPath>
      </defs>
      <g clip-path="url(#badge)">
        <rect width="256" height="256" fill="url(#bg)"/>
        <path d="M76 184 C 76 108, 180 148, 180 72" fill="none" stroke="#06121f" stroke-width="34" stroke-linecap="round"/>
        <path d="M76 184 C 76 108, 180 148, 180 72" fill="none" stroke="url(#link)" stroke-width="18" stroke-linecap="round"/>
        <path d="M76 184 C 76 108, 180 148, 180 72" fill="none" stroke="#081a2e" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 16" opacity=".55"/>
        <circle cx="180" cy="72" r="46" fill="url(#glow)"/>
        <circle cx="76" cy="184" r="27" fill="#0d2238" stroke="#e9c46a" stroke-width="9"/>
        <circle cx="180" cy="72" r="27" fill="#0d2238" stroke="#e9c46a" stroke-width="9"/>
        <circle cx="76" cy="184" r="8" fill="#34d0c3"/>
        <circle cx="180" cy="72" r="8" fill="#7ef0e4"/>
      </g>
    </svg>
    <div class="name"><b>SorTUN</b></div>
  </div>

  <div class="say">
    <div class="en">Your servers, linked. Your traffic, through.</div>
    <div class="fa">سرورهایتان به هم وصل، ترافیکتان در جریان.</div>
    <div class="sub">A fast, light tunnel between two servers, in Rust.</div>
  </div>
</div>
<script>if (location.search.includes("card")) document.body.classList.add("card");</script>
</body>
</html>
